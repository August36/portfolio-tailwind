<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="flex justify-between p-4 border-b-1 bg-[#010311] text-white">
            <div>
                <a href="/" class="font-bold">August Jarner</a>
            </div>

            <ul class="flex gap-4">
                <li>
                    <a href="">Work</a>
                </li>
                <li>
                    <a href="">About</a>
                </li>
                <li>
                    <a href="">Skills</a>
                </li>
                <li>
                    <a href="">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Hero -->
        <section class="bg-[#010311] text-white p-6">
            <div>

                <p class="mt-6 mb-6">
                    Looking for internship • Copenhagen / Zealand
                </p>

                <h1 class="font-bold text-5xl mb-12">
                    Building websites that are useful, accessible and
                    <span class="text-teal-300">easy to use.</span>
                </h1>

                <div class="flex flex-col md:flex-row">
                    <img
                        src="imgs/portfolio-profile-img2.jpg"
                        alt="Portrait of August Jarner"
                        class="w-[200px] h-[200px] object-cover br-2 rounded-lg mb-4"
                    >

                    <p class="mb-4">
                        Hi, I'm August, a web developer focused on building
                        fast, accessible, and sustainable digital experiences.
                    </p>
                </div>

                <div class="flex flex-col gap-2 mb-8 md:flex-row">
                    <a href="#contact"
                    class="p-3 min-w-[2.75rem] min-h-[2.75rem] text-black rounded-lg bg-teal-300 flex justify-center items-center">
                        Get in touch
                    </a>

                    <a href="#work"
                    class="p-3 min-w-[2.75rem] min-h-[2.75rem] border-[3px] border-teal-500 rounded-lg flex justify-center items-center">
                        See work
                    </a>
                </div>

            </div>
        </section>

        <section>
            
        </section>
        
    </main>

</body>
</html>
